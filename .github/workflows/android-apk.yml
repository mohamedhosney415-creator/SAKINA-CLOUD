name: Build SAKINA Release APKs

on:
  push:
    branches: [main, master, sakina-4-ui-streak, feature/sakina-5-upgrade]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sakina-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify project files
        run: python3 tool/verify_project.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --org com.hosny --project-name sakina --platforms=android .

      - name: Remove generated starter test only
        run: rm -f test/widget_test.dart

      - name: Patch Android
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Run regression tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Supabase secrets are retained; signing secrets are intentionally not used.
      # The generated Android debug keystore is used for signing this Release build.
      - name: Build split Release APKs (Supabase optional, no signing secrets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            flutter build apk --release --split-per-abi \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          elif [ -z "$SUPABASE_URL" ] && [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Supabase secrets are not set; building local-only APK."
            flutter build apk --release --split-per-abi
          else
            echo "Set both SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY, or leave both unset."
            exit 1
          fi

      - name: Enforce APK size limit (100 MB per download)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          output = Path("build/app/outputs/flutter-apk")
          apks = sorted(output.glob("app-*-release.apk"))
          if not apks:
              sys.exit("ERROR: No split Release APKs were produced.")
          limit = 100_000_000
          failed = False
          for apk in apks:
              size = apk.stat().st_size
              print(f"{apk.name}: {size:,} bytes ({size / 1_000_000:.2f} MB)")
              if size >= limit:
                  print(f"ERROR: {apk.name} is not below 100 MB.")
                  failed = True
          if failed:
              sys.exit(1)
          print("All downloadable APKs are below 100 MB.")
          PY

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "Checking $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: SAKINA-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - name: Publish stable Release APK downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: SAKINA Release APKs
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SAKINA-release-apks
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p out
            adb install -r apk/app-x86_64-release.apk
            adb logcat -c
            adb shell monkey -p com.hosny.sakina -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > out/logcat_full.txt
            adb exec-out screencap -p > out/screen.png
            adb shell pidof com.hosny.sakina > out/pid.txt || echo "NOT RUNNING" > out/pid.txt
            adb shell dumpsys activity activities | grep -i "mResumedActivity" > out/resumed.txt || true

      - name: Crash summary
        if: always()
        run: |
          echo "=== process status ==="; cat out/pid.txt || true
          echo "=== resumed activity ==="; cat out/resumed.txt || true
          echo "=== FATAL EXCEPTION / AndroidRuntime ==="
          grep -n -A30 "FATAL EXCEPTION" out/logcat_full.txt | head -150 || echo "no FATAL EXCEPTION found"
          echo "=== Flutter errors ==="
          grep -n "flutter\|E/flutter" out/logcat_full.txt | head -60 || true

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: out/
