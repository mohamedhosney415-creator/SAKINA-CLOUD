name: Publish SAKINA release

on:
  workflow_run:
    workflows: ["Build SAKINA APK"]
    types: [completed]
    branches: [main, feature/sakina-5-upgrade]

permissions:
  actions: read
  contents: write

concurrency:
  group: sakina-release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'feature/sakina-5-upgrade' }}
    runs-on: ubuntu-latest
    steps:
      - name: Read app version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip outdated branch builds
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH_NAME}" --jq '.object.sha')"
          if [ "$latest" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outdated build; a newer feature branch commit exists."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifact from successful build
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SAKINA-apk
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare release metadata
        if: steps.current.outputs.publish == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r' | xargs)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi

          APK_PATH="$(find release-assets -type f -iname '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::APK artifact is missing or empty"
            echo "Downloaded files:"
            find release-assets -maxdepth 5 -type f -print || true
            exit 1
          fi

          SAFE_VERSION="${VERSION//+/-}"
          TAG="v${SAFE_VERSION}-build-${{ github.event.workflow_run.run_number }}"
          APP_VERSION="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION#*+}"
          if [ "$BUILD_NUMBER" = "$VERSION" ]; then BUILD_NUMBER=0; fi

          {
            echo "version=$VERSION"
            echo "app_version=$APP_VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "tag=$TAG"
            echo "apk_path=$APK_PATH"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $TAG from build #${{ github.event.workflow_run.run_number }}"
          echo "APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Publish APK release
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: SAKINA ${{ steps.meta.outputs.version }} (Build #${{ github.event.workflow_run.run_number }})
          body: |
            نسخة SAKINA المبنية بنجاح من GitHub Actions.
            Build: #${{ github.event.workflow_run.run_number }}
            Commit: ${{ github.event.workflow_run.head_sha }}
          files: ${{ steps.meta.outputs.apk_path }}
          fail_on_unmatched_files: true
          make_latest: true

      - name: Update public update manifest on main
        if: steps.current.outputs.publish == 'true'
        env:
          LATEST_VERSION: ${{ steps.meta.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_NOTES: "يتوفر إصدار جديد من سكينة. افتح التطبيق واتبع رسالة التحديث."
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B update-manifest origin/main
          APK_URL="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/app-release.apk"
          jq -n \
            --arg version "$LATEST_VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg url "$APK_URL" \
            --arg notes "$RELEASE_NOTES" \
            '{latestVersion:$version, latestBuildNumber:($build|tonumber), apkUrl:$url, minimumVersion:null, minimumBuildNumber:0, notes:$notes, publishedAt:(now|todate)}' \
            > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "Update manifest already current."
            exit 0
          fi
          git commit -m "Publish SAKINA update manifest for ${RELEASE_TAG}"
          git push origin HEAD:main
